[package]
name = "fdtd-wasm"
version = "0.1.0"
edition = "2021"
description = "2D TMz and scalar FDTD, same update as src/fdtd.js, compiled to WebAssembly."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
